<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 viewport-fit=cover">

  <title>Leitor de Código de Barras</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      background: #f2f2f7;
      color: #111;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitulo {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    .camera {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mira {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 45%;
      height: 3px;
      background: red;
      box-shadow: 0 0 10px red;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: bold;
      color: white;
      background: #007aff;
    }

    button:active {
      opacity: 0.7;
    }

    #parar {
      background: #ff3b30;
    }

    #copiar {
      background: #34c759;
    }

    .resultado {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
    }

    .numero {
      font-size: 28px;
      font-weight: bold;
      color: #007aff;
      word-break: break-all;
      margin-top: 10px;
    }

    .tipo {
      color: #666;
      margin-top: 8px;
    }

    .mensagem {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #fff3cd;
      color: #664d03;
    }

    .erro {
      background: #ffebee;
      color: #b00020;
    }

    .oculto {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📷 Leitor de Código</h1>

  <p class="subtitulo">
    Aponte a câmera para o código de barras
  </p>

  <div class="camera">
    <video id="video"
           autoplay
           muted
           playsinline
           webkit-playsinline>
    </video>

    <div class="mira"></div>
  </div>

  <button id="iniciar">
    📷 Abrir câmera
  </button>

  <button id="parar" class="oculto">
    ⏹ Parar câmera
  </button>

  <div id="mensagem" class="mensagem oculto"></div>

  <div id="resultado" class="resultado oculto">

    <strong>Número encontrado:</strong>

    <div id="numero" class="numero"></div>

    <div id="tipo" class="tipo"></div>

    <button id="copiar">
      📋 Copiar número
    </button>

  </div>

</div>


<!-- Biblioteca ZXing -->
<script src="https://unpkg.com/@zxing/browser@0.2.1/umd/index.min.js"></script>


<script>

const video = document.getElementById("video");
const iniciar = document.getElementById("iniciar");
const parar = document.getElementById("parar");

const mensagem = document.getElementById("mensagem");
const resultado = document.getElementById("resultado");

const numero = document.getElementById("numero");
const tipo = document.getElementById("tipo");
const copiar = document.getElementById("copiar");

let stream = null;
let leitor = null;
let controles = null;

let ultimoCodigo = "";
let ultimaLeitura = 0;


/*
--------------------------------------------------
MOSTRAR MENSAGEM
--------------------------------------------------
*/

function mostrarMensagem(texto, erro = false) {

  mensagem.textContent = texto;
  mensagem.classList.remove("oculto");

  if (erro) {
    mensagem.classList.add("erro");
  } else {
    mensagem.classList.remove("erro");
  }
}


/*
--------------------------------------------------
INICIAR CÂMERA
--------------------------------------------------
*/

iniciar.addEventListener("click", async () => {

  mensagem.classList.add("oculto");
  resultado.classList.add("oculto");

  ultimoCodigo = "";

  /*
  Verifica HTTPS
  */

  if (!window.isSecureContext) {

    mostrarMensagem(
      "Este site precisa ser aberto pelo endereço HTTPS do GitHub Pages.",
      true
    );

    return;
  }


  /*
  Verifica suporte à câmera
  */

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    mostrarMensagem(
      "O navegador não disponibilizou acesso à câmera.",
      true
    );

    return;
  }


  try {

    mostrarMensagem(
      "Solicitando acesso à câmera..."
    );


    /*
    Abre diretamente a câmera traseira.
    */

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }
        },

        audio: false

      });


    /*
    Coloca a câmera no vídeo.
    */

    video.srcObject = stream;

    await video.play();


    mostrarMensagem(
      "✅ Câmera aberta. Aponte para o código de barras."
    );


    iniciar.classList.add("oculto");
    parar.classList.remove("oculto");


    /*
    Inicia o leitor
    */

    leitor =
      new ZXingBrowser.BrowserMultiFormatReader();


    controles =
      await leitor.decodeFromStream(
        stream,
        video,
        (resultadoLeitura, erroLeitura) => {

          if (!resultadoLeitura) {
            return;
          }


          const codigo =
            resultadoLeitura.getText();


          /*
          Evita múltiplas leituras
          */

          const agora = Date.now();

          if (
            codigo === ultimoCodigo &&
            agora - ultimaLeitura < 3000
          ) {
            return;
          }


          ultimoCodigo = codigo;
          ultimaLeitura = agora;


          /*
          Mostra resultado
          */

          numero.textContent = codigo;


          try {

            tipo.textContent =
              "Tipo: " +
              resultadoLeitura
                .getBarcodeFormat();

          } catch {

            tipo.textContent =
              "Código de barras detectado";

          }


          resultado.classList.remove("oculto");


          /*
          Vibração
          */

          if (navigator.vibrate) {
            navigator.vibrate(150);
          }

        }
      );

  }

  catch (erro) {

    console.error(erro);

    let texto =
      "Não foi possível abrir a câmera.";


    if (erro.name === "NotAllowedError") {

      texto =
        "O acesso à câmera foi bloqueado. " +
        "Verifique as permissões do Chrome " +
        "para este site.";

    }

    else if (erro.name === "NotFoundError") {

      texto =
        "Nenhuma câmera foi encontrada.";

    }

    else if (erro.name === "NotReadableError") {

      texto =
        "A câmera está sendo usada por outro aplicativo.";

    }

    else if (erro.name === "SecurityError") {

      texto =
        "O navegador bloqueou o acesso à câmera.";

    }


    mostrarMensagem(texto, true);


    pararCamera();

  }

});


/*
--------------------------------------------------
PARAR CÂMERA
--------------------------------------------------
*/

function pararCamera() {

  if (controles) {

    try {
      controles.stop();
    } catch {}

    controles = null;
  }


  if (leitor) {

    try {
      leitor.reset();
    } catch {}

    leitor = null;
  }


  if (stream) {

    stream
      .getTracks()
      .forEach(track => track.stop());

    stream = null;
  }


  video.srcObject = null;


  iniciar.classList.remove("oculto");
  parar.classList.add("oculto");
}


parar.addEventListener(
  "click",
  pararCamera
);


/*
--------------------------------------------------
COPIAR
--------------------------------------------------
*/

copiar.addEventListener("click", async () => {

  const texto =
    numero.textContent.trim();


  try {

    await navigator
      .clipboard
      .writeText(texto);


    copiar.textContent =
      "✅ Número copiado!";


    setTimeout(() => {

      copiar.textContent =
        "📋 Copiar número";

    }, 1500);

  }

  catch {

    /*
    Fallback para iPhone
    */

    const campo =
      document.createElement("textarea");

    campo.value = texto;

    document.body.appendChild(campo);

    campo.select();

    document.execCommand("copy");

    campo.remove();


    copiar.textContent =
      "✅ Número copiado!";


    setTimeout(() => {

      copiar.textContent =
        "📋 Copiar número";

    }, 1500);

  }

});

</script>

</body>
</html>
