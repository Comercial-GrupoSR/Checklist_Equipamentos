<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leitor de Código de Barras</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f2f7;
      color: #111;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    .scanner {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: #000;
      aspect-ratio: 4 / 3;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .linha {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 50%;
      height: 3px;
      background: #ff2d55;
      box-shadow: 0 0 10px #ff2d55;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: 0;
      border-radius: 12px;
      background: #007aff;
      color: white;
      font-size: 17px;
      font-weight: 600;
    }

    button:active {
      opacity: 0.7;
    }

    #parar {
      background: #ff3b30;
    }

    .resultado {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .numero {
      font-size: 28px;
      font-weight: bold;
      word-break: break-all;
      margin: 10px 0;
      color: #007aff;
    }

    .tipo {
      color: #666;
    }

    .erro {
      color: #ff3b30;
      margin-top: 15px;
    }

    .oculto {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>📷 Leitor de Código</h1>

    <p class="subtitle">
      Aponte a câmera para o código de barras
    </p>

    <div class="scanner">
      <video id="video" playsinline></video>
      <div class="linha"></div>
    </div>

    <button id="iniciar">
      📷 Iniciar câmera
    </button>

    <button id="parar" class="oculto">
      ⏹ Parar câmera
    </button>

    <div id="resultado" class="resultado oculto">

      <div>Resultado:</div>

      <div id="numero" class="numero"></div>

      <div id="tipo" class="tipo"></div>

      <button id="copiar">
        📋 Copiar número
      </button>

    </div>

    <div id="erro" class="erro"></div>

  </div>


  <!-- ZXing Browser -->
  <script src="https://unpkg.com/@zxing/browser@0.2.1/umd/index.min.js"></script>


  <script>

    const video = document.getElementById("video");
    const iniciar = document.getElementById("iniciar");
    const parar = document.getElementById("parar");

    const resultado = document.getElementById("resultado");
    const numero = document.getElementById("numero");
    const tipo = document.getElementById("tipo");

    const copiar = document.getElementById("copiar");
    const erro = document.getElementById("erro");

    let leitor = null;
    let controles = null;
    let ultimoCodigo = "";


    iniciar.addEventListener("click", async () => {

      erro.textContent = "";

      resultado.classList.add("oculto");

      iniciar.classList.add("oculto");
      parar.classList.remove("oculto");

      try {

        leitor = new ZXingBrowser.BrowserMultiFormatReader();

        /*
          Tentamos pedir diretamente a câmera traseira.
          Isso é especialmente útil no iPhone.
        */

        const constraints = {
          video: {
            facingMode: {
              ideal: "environment"
            },
            width: {
              ideal: 1920
            },
            height: {
              ideal: 1080
            }
          },
          audio: false
        };


        controles = await leitor.decodeFromConstraints(
          constraints,
          video,
          (resultadoLeitura, erroLeitura) => {

            if (!resultadoLeitura) {
              return;
            }

            const texto = resultadoLeitura.getText();

            /*
              Evita ficar mostrando o mesmo código
              várias vezes enquanto a câmera continua lendo.
            */

            if (texto === ultimoCodigo) {
              return;
            }

            ultimoCodigo = texto;

            numero.textContent = texto;

            try {
              tipo.textContent =
                "Tipo: " +
                resultadoLeitura.getBarcodeFormat();
            } catch {
              tipo.textContent = "Código detectado";
            }

            resultado.classList.remove("oculto");

            /*
              Vibração no celular, quando disponível.
            */

            if (navigator.vibrate) {
              navigator.vibrate(150);
            }

          }
        );

      } catch (e) {

        console.error(e);

        erro.textContent =
          "Não foi possível acessar a câmera. " +
          "Verifique se você permitiu o acesso à câmera.";

        iniciar.classList.remove("oculto");
        parar.classList.add("oculto");
      }

    });


    parar.addEventListener("click", () => {

      if (controles) {
        controles.stop();
        controles = null;
      }

      if (leitor) {
        leitor.reset();
      }

      video.srcObject = null;

      iniciar.classList.remove("oculto");
      parar.classList.add("oculto");

    });


    copiar.addEventListener("click", async () => {

      const texto = numero.textContent;

      try {

        await navigator.clipboard.writeText(texto);

        copiar.textContent = "✅ Copiado!";

        setTimeout(() => {
          copiar.textContent = "📋 Copiar número";
        }, 1500);

      } catch {

        alert("Não foi possível copiar automaticamente.");

      }

    });

  </script>

</body>
</html>
