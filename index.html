<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Leitor de Código de Barras</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      background: #f2f2f7;
      color: #111;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitulo {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    .camera {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mira {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 45%;
      height: 3px;
      background: red;
      box-shadow: 0 0 10px red;
      pointer-events: none;
    }

    .area-botoes {
      display: flex;
      gap: 10px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: bold;
      color: white;
      background: #007aff;
      cursor: pointer;
    }

    button:active {
      opacity: 0.7;
    }

    #parar {
      background: #ff3b30;
    }

    #trocar {
      background: #5856d6;
    }

    #copiar {
      background: #34c759;
    }

    .resultado {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
    }

    .numero {
      font-size: 28px;
      font-weight: bold;
      color: #007aff;
      word-break: break-all;
      margin-top: 10px;
    }

    .tipo {
      color: #666;
      margin-top: 8px;
    }

    .mensagem {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #fff3cd;
      color: #664d03;
    }

    .erro {
      background: #ffebee;
      color: #b00020;
    }

    .sucesso {
      background: #e8f5e9;
      color: #1b5e20;
    }

    .oculto {
      display: none;
    }

    .camera-info {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-top: 8px;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>📷 Leitor de Código</h1>

  <p class="subtitulo">
    Aponte a câmera para o código de barras
  </p>


  <!-- CÂMERA -->

  <div class="camera">

    <video
      id="video"
      autoplay
      muted
      playsinline
      webkit-playsinline>
    </video>

    <div class="mira"></div>

  </div>


  <div id="cameraInfo" class="camera-info">
    Câmera não iniciada
  </div>


  <!-- BOTÕES -->

  <button id="iniciar">
    📷 Abrir câmera
  </button>


  <div class="area-botoes">

    <button id="trocar" class="oculto">
      🔄 Trocar câmera
    </button>

    <button id="parar" class="oculto">
      ⏹ Parar
    </button>

  </div>


  <!-- MENSAGEM -->

  <div
    id="mensagem"
    class="mensagem oculto">
  </div>


  <!-- RESULTADO -->

  <div
    id="resultado"
    class="resultado oculto">

    <strong>Número encontrado:</strong>

    <div
      id="numero"
      class="numero">
    </div>

    <div
      id="tipo"
      class="tipo">
    </div>


    <button id="copiar">
      📋 Copiar número
    </button>

  </div>

</div>


<!--
==================================================
ZXING
==================================================
-->

<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>


<script>

"use strict";


/*
==================================================
ELEMENTOS
==================================================
*/

const video =
  document.getElementById("video");

const iniciar =
  document.getElementById("iniciar");

const parar =
  document.getElementById("parar");

const trocar =
  document.getElementById("trocar");

const mensagem =
  document.getElementById("mensagem");

const resultado =
  document.getElementById("resultado");

const numero =
  document.getElementById("numero");

const tipo =
  document.getElementById("tipo");

const copiar =
  document.getElementById("copiar");

const cameraInfo =
  document.getElementById("cameraInfo");


/*
==================================================
VARIÁVEIS
==================================================
*/

let stream = null;

let leitor = null;

let controles = null;

let cameras = [];

let cameraAtual = 0;

let ultimoCodigo = "";

let ultimaLeitura = 0;


/*
==================================================
MENSAGEM
==================================================
*/

function mostrarMensagem(texto, tipoMensagem = "normal") {

  mensagem.textContent = texto;

  mensagem.classList.remove(
    "oculto",
    "erro",
    "sucesso"
  );

  if (tipoMensagem === "erro") {

    mensagem.classList.add("erro");

  }

  else if (tipoMensagem === "sucesso") {

    mensagem.classList.add("sucesso");

  }

}


/*
==================================================
OCULTAR MENSAGEM
==================================================
*/

function ocultarMensagem() {

  mensagem.classList.add("oculto");

}


/*
==================================================
VERIFICAR SUPORTE
==================================================
*/

function verificarSuporte() {

  if (!window.isSecureContext) {

    mostrarMensagem(
      "⚠️ O site precisa estar aberto em HTTPS. " +
      "Verifique se está acessando pelo GitHub Pages.",
      "erro"
    );

    return false;
  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    mostrarMensagem(
      "❌ Este navegador não permite acesso à câmera.",
      "erro"
    );

    return false;
  }


  if (
    typeof ZXingBrowser === "undefined"
  ) {

    mostrarMensagem(
      "❌ A biblioteca de leitura não foi carregada.",
      "erro"
    );

    return false;
  }


  return true;

}


/*
==================================================
OBTER CÂMERAS
==================================================
*/

async function obterCameras() {

  try {

    cameras =
      await ZXingBrowser.BrowserCodeReader
        .listVideoInputDevices();


    if (!cameras || cameras.length === 0) {

      mostrarMensagem(
        "❌ Nenhuma câmera foi encontrada.",
        "erro"
      );

      return false;
    }


    console.log(
      "Câmeras encontradas:",
      cameras
    );


    /*
    Procura câmera traseira
    */

    const indiceTraseira =
      cameras.findIndex(camera => {

        const nome =
          (camera.label || "").toLowerCase();

        return (
          nome.includes("back") ||
          nome.includes("rear") ||
          nome.includes("environment") ||
          nome.includes("traseira") ||
          nome.includes("posterior")
        );

      });


    if (indiceTraseira >= 0) {

      cameraAtual =
        indiceTraseira;

    }

    else {

      cameraAtual = 0;

    }


    return true;

  }

  catch (erro) {

    console.error(
      "Erro ao obter câmeras:",
      erro
    );

    mostrarMensagem(
      "❌ Não foi possível identificar as câmeras.",
      "erro"
    );

    return false;

  }

}


/*
==================================================
INICIAR CÂMERA
==================================================
*/

async function iniciarCamera() {

  /*
  Verifica suporte
  */

  if (!verificarSuporte()) {
    return;
  }


  /*
  Limpa resultado anterior
  */

  resultado.classList.add("oculto");

  ultimoCodigo = "";

  numero.textContent = "";

  tipo.textContent = "";


  try {

    mostrarMensagem(
      "📷 Solicitando acesso à câmera..."
    );


    /*
    Se já existe câmera,
    encerra primeiro.
    */

    pararCameraInterno();


    /*
    Primeiro solicita permissão.
    Isso é importante principalmente
    em celulares.
    */

    const permissao =
      await navigator.mediaDevices.getUserMedia({

        video: true,

        audio: false

      });


    /*
    Para o stream temporário.
    */

    permissao
      .getTracks()
      .forEach(track => track.stop());


    /*
    Agora lista as câmeras.
    */

    const encontrou =
      await obterCameras();


    if (!encontrou) {
      return;
    }


    /*
    Cria o leitor.
    */

    leitor =
      new ZXingBrowser.BrowserMultiFormatReader();


    /*
    ID da câmera escolhida.
    */

    const cameraId =
      cameras[cameraAtual].deviceId;


    /*
    Informação da câmera.
    */

    cameraInfo.textContent =
      cameras[cameraAtual].label ||
      "Câmera selecionada";


    mostrarMensagem(
      "📷 Abrindo câmera..."
    );


    /*
    Inicia câmera e leitor.
    */

    controles =
      await leitor.decodeFromVideoDevice(

        cameraId,

        video,

        function(resultadoLeitura, erroLeitura) {

          /*
          Nada encontrado ainda.
          */

          if (!resultadoLeitura) {
            return;
          }


          /*
          Obtém código.
          */

          const codigo =
            resultadoLeitura.getText();


          if (!codigo) {
            return;
          }


          /*
          Evita leitura duplicada.
          */

          const agora =
            Date.now();


          if (
            codigo === ultimoCodigo &&
            agora - ultimaLeitura < 3000
          ) {

            return;

          }


          ultimoCodigo =
            codigo;

          ultimaLeitura =
            agora;


          /*
          Mostra resultado.
          */

          numero.textContent =
            codigo;


          /*
          Identifica tipo.
          */

          try {

            tipo.textContent =
              "Tipo: " +
              resultadoLeitura
                .getBarcodeFormat();

          }

          catch {

            tipo.textContent =
              "Código de barras detectado";

          }


          /*
          Exibe resultado.
          */

          resultado.classList.remove(
            "oculto"
          );


          /*
          Mensagem.
          */

          mostrarMensagem(
            "✅ Código lido com sucesso!",
            "sucesso"
          );


          /*
          Vibração.
          */

          if (
            navigator.vibrate
          ) {

            navigator.vibrate(
              [100, 50, 100]
            );

          }


          /*
          Som.
          */

          emitirSom();

        }
      );


    /*
    Interface.
    */

    iniciar.classList.add(
      "oculto"
    );

    parar.classList.remove(
      "oculto"
    );

    trocar.classList.remove(
      "oculto"
    );


    mostrarMensagem(
      "✅ Câmera aberta. Aponte para o código de barras."
    );

  }

  catch (erro) {

    console.error(
      "ERRO AO ABRIR CÂMERA:",
      erro
    );


    tratarErroCamera(
      erro
    );


    pararCameraInterno();

  }

}


/*
==================================================
TRATAR ERROS
==================================================
*/

function tratarErroCamera(erro) {

  let texto =
    "❌ Não foi possível abrir a câmera.";


  if (
    erro &&
    erro.name === "NotAllowedError"
  ) {

    texto =
      "🔒 O acesso à câmera foi bloqueado. " +
      "No Chrome, toque no cadeado ao lado do endereço " +
      "e permita o uso da câmera.";

  }


  else if (
    erro &&
    erro.name === "PermissionDeniedError"
  ) {

    texto =
      "🔒 Permissão da câmera negada.";

  }


  else if (
    erro &&
    erro.name === "NotFoundError"
  ) {

    texto =
      "📷 Nenhuma câmera foi encontrada.";

  }


  else if (
    erro &&
    erro.name === "NotReadableError"
  ) {

    texto =
      "⚠️ A câmera está sendo usada por outro aplicativo.";

  }


  else if (
    erro &&
    erro.name === "OverconstrainedError"
  ) {

    texto =
      "⚠️ A câmera selecionada não está disponível.";

  }


  else if (
    erro &&
    erro.name === "SecurityError"
  ) {

    texto =
      "🔒 O navegador bloqueou o acesso à câmera.";

  }


  else if (
    erro &&
    erro.message
  ) {

    texto =
      "❌ Erro da câmera: " +
      erro.message;

  }


  mostrarMensagem(
    texto,
    "erro"
  );

}


/*
==================================================
TROCAR CÂMERA
==================================================
*/

async function trocarCamera() {

  if (
    !cameras ||
    cameras.length < 2
  ) {

    mostrarMensagem(
      "⚠️ O dispositivo possui apenas uma câmera disponível."
    );

    return;
  }


  /*
  Próxima câmera
  */

  cameraAtual =
    (cameraAtual + 1) %
    cameras.length;


  /*
  Reinicia.
  */

  await iniciarCamera();

}


/*
==================================================
PARAR CÂMERA INTERNO
==================================================
*/

function pararCameraInterno() {

  /*
  Para ZXing.
  */

  if (controles) {

    try {

      if (
        typeof controles.stop ===
        "function"
      ) {

        controles.stop();

      }

    }

    catch (erro) {

      console.warn(
        "Erro ao parar controles:",
        erro
      );

    }

    controles = null;

  }


  /*
  Reseta leitor.
  */

  if (leitor) {

    try {

      if (
        typeof leitor.reset ===
        "function"
      ) {

        leitor.reset();

      }

    }

    catch (erro) {

      console.warn(
        "Erro ao resetar leitor:",
        erro
      );

    }

    leitor = null;

  }


  /*
  Para stream.
  */

  if (stream) {

    stream
      .getTracks()
      .forEach(track => {

        try {

          track.stop();

        }

        catch {}

      });

    stream = null;

  }


  /*
  Também verifica stream
  diretamente do vídeo.
  */

  if (
    video.srcObject
  ) {

    try {

      video.srcObject
        .getTracks()
        .forEach(track => {
          track.stop();
        });

    }

    catch {}

    video.srcObject = null;

  }

}


/*
==================================================
PARAR CÂMERA
==================================================
*/

function pararCamera() {

  pararCameraInterno();


  iniciar.classList.remove(
    "oculto"
  );


  parar.classList.add(
    "oculto"
  );


  trocar.classList.add(
    "oculto"
  );


  cameraInfo.textContent =
    "Câmera não iniciada";


  mostrarMensagem(
    "⏹ Câmera desligada."
  );

}


parar.addEventListener(
  "click",
  pararCamera
);


/*
==================================================
INICIAR
==================================================
*/

iniciar.addEventListener(
  "click",
  iniciarCamera
);


/*
==================================================
TROCAR
==================================================
*/

trocar.addEventListener(
  "click",
  trocarCamera
);


/*
==================================================
COPIAR
==================================================
*/

copiar.addEventListener(
  "click",
  async function() {

    const texto =
      numero.textContent.trim();


    if (!texto) {

      mostrarMensagem(
        "⚠️ Não existe nenhum código para copiar.",
        "erro"
      );

      return;

    }


    try {

      await navigator.clipboard.writeText(
        texto
      );


      copiar.textContent =
        "✅ Número copiado!";


      setTimeout(
        function() {

          copiar.textContent =
            "📋 Copiar número";

        },
        1500
      );

    }

    catch (erro) {

      /*
      Fallback.
      */

      try {

        const campo =
          document.createElement(
            "textarea"
          );


        campo.value =
          texto;


        campo.style.position =
          "fixed";


        campo.style.opacity =
          "0";


        document.body.appendChild(
          campo
        );


        campo.focus();

        campo.select();


        document.execCommand(
          "copy"
        );


        campo.remove();


        copiar.textContent =
          "✅ Número copiado!";


        setTimeout(
          function() {

            copiar.textContent =
              "📋 Copiar número";

          },
          1500
        );

      }

      catch {

        mostrarMensagem(
          "❌ Não foi possível copiar o código.",
          "erro"
        );

      }

    }

  }
);


/*
==================================================
SOM
==================================================
*/

function emitirSom() {

  try {

    const contexto =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    const oscilador =
      contexto.createOscillator();


    const ganho =
      contexto.createGain();


    oscilador.connect(
      ganho
    );


    ganho.connect(
      contexto.destination
    );


    oscilador.frequency.value =
      1000;


    ganho.gain.value =
      0.15;


    oscilador.start();


    oscilador.stop(
      contexto.currentTime +
      0.15
    );

  }

  catch (erro) {

    console.warn(
      "Não foi possível emitir som:",
      erro
    );

  }

}


/*
==================================================
LIMPEZA AO SAIR
==================================================
*/

window.addEventListener(
  "beforeunload",
  function() {

    pararCameraInterno();

  }
);


</script>

</body>
</html>
